# What changed decides what runs (changes): gate, smoke, smoke-os and
# docker for code; docs builds the site for docs changes. A skipped job
# counts as passed for the branch rule, so a docs-only PR still merges.
# The Linux runner's resolver answers *.localhost already; the hosts
# step makes it explicit, macOS and Windows get hosts lines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed decides what runs. A docs-only change builds the site;
  # anything else runs the Go gate, the smokes and the image. Skipped
  # jobs count as passed for the branch rule, so a docs PR still merges.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          files=$(git diff --name-only "$range")
          printf 'changed:\n%s\n' "$files"
          code=false; docs=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*) docs=true ;;
              demo/*|SECURITY.md|CONTRIBUTING.md|README.md|LICENSE|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml) ;;
              *) code=true ;;
            esac
          done <<<"$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
  gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  smoke:
    needs: [changes, gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner context is not available to a job-level env block;
      # a step can read $RUNNER_TEMP and export the directory for the rest.
      - name: Where the server lives
        run: echo "CI_DIR=$RUNNER_TEMP/armite-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sdk-smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Azurite, the way a user gets it
        run: ARMITE_HOME="$CI_DIR/home" go run ./cmd/armite azurite install
      - name: Hostnames
        run: ./scripts/ci/hosts.sh | sudo tee -a /etc/hosts && getent hosts kv-demo.vault.localhost
      - name: Start the server
        run: ./scripts/ci/server.sh start
      - name: az
        run: ./scripts/ci/az-smoke.sh
      - name: Fresh state, same CA
        run: ./scripts/ci/server.sh reset
      - name: Azure SDK for JavaScript
        run: ./scripts/ci/node-smoke.sh
      - name: Fresh state, same CA
        run: ./scripts/ci/server.sh reset
      - name: Terraform
        run: ./scripts/ci/terraform-smoke.sh
      - name: Stop the server
        if: always()
        run: ./scripts/ci/server.sh stop
      - name: Server log
        if: failure()
        run: tail -60 "$CI_DIR/server.log"

  # The same server and az smoke on the two platforms the release
  # archives ship for and nobody runs by hand: macOS on Apple silicon
  # and Windows under Git Bash. One pass each, no resets.
  smoke-os:
    needs: [changes, gate]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Where the server lives
        run: echo "CI_DIR=$RUNNER_TEMP/armite-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests on this platform
        run: go test -count=1 ./...
      - name: Azurite, cached between runs
        id: azurite
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/azurite
          key: azurite-3.37.0-${{ runner.os }}-${{ runner.arch }}
      - name: Azurite, the blob store behind storage accounts
        if: steps.azurite.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/azurite" --no-audit --no-fund --loglevel=error azurite@3.37.0
      - name: Save the Azurite install
        if: steps.azurite.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/azurite
          key: ${{ steps.azurite.outputs.cache-primary-key }}
      - name: Azurite on the PATH
        run: echo "$RUNNER_TEMP/azurite/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Hostnames (macOS)
        if: runner.os == 'macOS'
        run: |
          { echo; ./scripts/ci/hosts.sh; } | sudo tee -a /etc/hosts >/dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
      - name: Hostnames (Windows)
        if: runner.os == 'Windows'
        run: |
          { echo; ./scripts/ci/hosts.sh; } >> /c/Windows/System32/drivers/etc/hosts
      - name: Hostnames resolve
        run: node -e "require('dns').lookup('kv-demo.vault.localhost',(e,a)=>{if(e){console.error(e.message);process.exit(1)}console.log(a)})"
      - name: Start the server
        run: ./scripts/ci/server.sh start
      - name: az
        run: ./scripts/ci/az-smoke.sh
      - name: Stop the server
        if: always()
        run: ./scripts/ci/server.sh stop
      - name: Server log
        if: failure()
        run: tail -60 "$CI_DIR/server.log"

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and boot
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            docker compose logs 2>/dev/null | grep -q 'Serving https' && break; sleep 1
          done
          docker compose logs
      - name: Answers, with Azurite inside and the hosts lines
        run: |
          docker compose cp armite:/data/ca.pem ./ca.pem
          curl -sS --fail --cacert ./ca.pem --resolve management.localhost:8443:127.0.0.1 \
            'https://management.localhost:8443/metadata/endpoints?api-version=2022-09-01' | head -c 200; echo
          docker compose logs | grep -q 'azurite: serving' || { echo "no Azurite in the image"; exit 1; }
          docker compose exec armite /app/armite hosts
      - if: always()
        run: docker compose down -v

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
